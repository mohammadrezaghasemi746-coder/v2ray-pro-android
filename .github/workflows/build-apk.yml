name: Build V2Ray Pro Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project Root & Download Official libv2ray.aar
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -fL --retry 3 -o "$PROJECT_DIR/app/libs/libv2ray.aar" \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -lh "$PROJECT_DIR/app/libs/libv2ray.aar"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2RayPro-Android-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
